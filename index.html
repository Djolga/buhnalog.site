  <meta name="description" content="Ирина Гончаренко — помощь в управлении финансами, налоговое консультирование и бухгалтерский аутсорсинг.">
  <title>Ирина Гончаренко — полезные ссылки</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: light; --ink:#102f49; --teal:#159b73; --teal-dark:#079b72; --gold:#e6c76d; --paper:#f5fbf8; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; min-height:100svh; display:flex; justify-content:center; align-items:center; padding:36px 20px; color:var(--ink); background:linear-gradient(155deg,#fbfdfb 0%,#e0f4ed 54%,#c5eadd 100%); font-family:'Manrope', system-ui, sans-serif; }
    main { width:min(100%,480px); text-align:center; }
    .avatar-wrap { width:140px; height:140px; margin:0 auto 22px; padding:5px; border-radius:50%; background:linear-gradient(145deg,#e4ce87,var(--teal)); box-shadow:0 8px 24px #14264120; }
    .avatar { display:block; width:100%; height:100%; border-radius:50%; object-fit:cover; object-position:50% 8%; border:3px solid white; }
    h1 { margin:0; font-size:clamp(28px,7vw,36px); line-height:1.2; letter-spacing:-1.2px; font-family:Georgia, 'Times New Roman', serif; font-weight:700; }
    .description { max-width:420px; margin:12px auto 42px; color:#536b80; font-size:18px; line-height:1.62; font-weight:500; }
    .links { display:grid; gap:13px; }
    .link { min-height:64px; display:flex; align-items:center; justify-content:space-between; gap:16px; padding:17px 20px; border:0; border-radius:20px; color:#fff; background:#159b73; box-shadow:0 10px 22px #087e5c35; text-decoration:none; font-weight:700; font-size:18px; transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease; }
    .link:hover { transform:translateY(-3px); box-shadow:0 14px 26px #087e5c45; }
    .link:focus-visible, .social a:focus-visible { outline:3px solid var(--gold); outline-offset:4px; }
    .link .mark { display:none; }
    .link .label { flex:1; text-align:center; }
    .arrow { display:none; }
    .social-heading { display:flex; align-items:center; gap:14px; margin:28px 0 18px; color:#536b80; font-size:15px; }
    .social-heading::before, .social-heading::after { content:""; flex:1; height:1px; background:#b8d8ce; }
    .social { display:flex; flex-wrap:wrap; justify-content:center; gap:17px; }
    .social a { width:44px; height:44px; display:grid; place-items:center; border:1px solid #d3e4de; border-radius:50%; color:var(--teal-dark); background:#f8fcfa; transition:transform .2s ease, background .2s ease; }
    .social a:hover { transform:translateY(-3px); background:#fff; }
    .social svg { width:21px; height:21px; fill:currentColor; }
    .footer { margin:48px 0 0; color:#8299a1; font-size:11px; letter-spacing:.08em; text-transform:uppercase; }
    @media (max-width:380px) { body { padding:28px 16px; } .avatar-wrap { width:124px; height:124px; } .link { min-height:60px; padding:15px 16px; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto !important; transition:none !important; } }
  </style>
